#
# CI for the benchmark results harness (scripts/ + benchmarks/). The harness is
# stdlib-only and needs no GPU, so this runs fast on a stock runner.
name: results-harness

on:
  push:
    paths:
      - "scripts/**"
      - "benchmarks/**"
      - "BENCHMARKS.md"
      - ".github/workflows/results-harness.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "benchmarks/**"
      - "BENCHMARKS.md"
      - ".github/workflows/results-harness.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The harness claims Python 3.9+; test the floor and current versions.
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the results-harness selftest
        run: python scripts/selftest_results_harness.py

      - name: Check BENCHMARKS.md is rendered from committed runs
        run: python scripts/render_benchmarks.py --check
